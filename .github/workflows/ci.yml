name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Also runs `prepare` (tsc build), so a broken build fails here.
      - run: npm ci
      - run: npm run typecheck
      # Offline suite only: every upstream (Anthropic, cheap provider, JEV) is a local fake.
      # Real-API checks live in scripts/ and never run in CI.
      - run: npm test
